<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ласкаво просимо</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --border: #2c313c;
      --text: #e6e8ee;
      --muted: #8b92a3;
      --accent: #6c8cff;
      --accent-hover: #5878f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    p { color: var(--muted); margin-bottom: 20px; }

    a.back {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.2s;
    }
    a.back:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main class="card">
    <img src="picture.png">
    <h1 id="greeting">Ласкаво просимо!</h1>
    <p>Ви успішно увійшли.</p>
    <a class="back" href="login-form.html">Назад до входу</a>
  </main>

  <script>
    try {
      const name = sessionStorage.getItem('firstName');
      if (name) {
        document.getElementById('greeting').textContent = 'Ласкаво просимо, ' + name + '!';
      }
    } catch (e) {}
  </script>
</body>
</html>

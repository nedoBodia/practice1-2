<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма входу</title>
  <link rel="stylecss" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Вхід</h1>
    <p class="subtitle">Введіть свої дані, щоб продовжити</p>

    <form action="#" method="post">
      <div class="row">
        <div class="field">
          <label for="first-name">Ім'я</label>
          <input type="text" id="first-name" name="first_name" placeholder="Іван" autocomplete="given-name" required>
        </div>
        <div class="field">
          <label for="last-name">Прізвище</label>
          <input type="text" id="last-name" name="last_name" placeholder="Петренко" autocomplete="family-name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Електронна пошта</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required>
          <button type="button" class="toggle" id="toggle" aria-label="Показати пароль">Показати</button>
        </div>
      </div>

      <button type="submit" class="submit">Увійти</button>
    </form>
  </main>

  <script>
    const input = document.getElementById('password');
    const toggle = document.getElementById('toggle');
    document.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      try {
        sessionStorage.setItem('firstName', document.getElementById('first-name').value.trim());
      } catch (err) {}
      window.location.href = 'welcome.html';
    });

    toggle.addEventListener('click', () => {
      const hidden = input.type === 'password';
      input.type = hidden ? 'text' : 'password';
      toggle.textContent = hidden ? 'Сховати' : 'Показати';
      toggle.setAttribute('aria-label', hidden ? 'Сховати пароль' : 'Показати пароль');
    });
  </script>
</body>
</html>
